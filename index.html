
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Kapamilya Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #173b64;
      padding: 20px;
      margin: 0;
    }
    h2 { text-align: center; }
    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin: 15px 0;
    }
    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
    #reader { width: 100%; }
    #barcode {
      font-size: 24px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Kapamilya Warehouse</h2>
  <p style="text-align:center">Live Barcode Scanner</p>

  <div class="card">
    <button id="start" onclick="startScanner()">
      Open Camera Scanner
    </button>
    <button id="stop" onclick="stopScanner()" disabled>
      Stop Camera
    </button>
    <div id="reader"></div>
  </div>

  <div class="card">
    <p>Scanned Barcode:</p>
    <div id="barcode">No barcode scanned yet</div>
    <p id="status">Ready to scan.</p>
    <button id="returnButton"
            onclick="returnToRegistration()"
            style="display:none">
      Return to Registration
    </button>
  </div>

<script>
const REGISTRATION_URL =
  'https://script.google.com/a/macros/kapamilya.com.au/s/AKfycbzxm6U5O5n7YjGPmSMOM0ng9InXG1XzVnmXoVEl4zcVPbPmWAcXuEcC3vcijlYjMLYedw/exec';

let scanner = null;
let starting = false;
let scanning = false;
let scanComplete = false;
let scannedBarcode = '';

const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const returnBtn = document.getElementById('returnButton');
const statusEl = document.getElementById('status');
const barcodeEl = document.getElementById('barcode');

async function startScanner() {
  if (starting || scanning) return;

  if (typeof Html5Qrcode === 'undefined') {
    statusEl.textContent = 'Scanner library failed to load.';
    return;
  }

  starting = true;
  scanComplete = false;
  scannedBarcode = '';
  startBtn.disabled = true;
  returnBtn.style.display = 'none';
  barcodeEl.textContent = 'No barcode scanned yet';
  statusEl.textContent = 'Opening camera...';

  try {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF
      ],
      verbose: false
    });

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 250, height: 150 }
      },
      async decodedText => {
        if (scanComplete) return;

        scanComplete = true;
        scannedBarcode = decodedText;
        barcodeEl.textContent = decodedText;
        statusEl.textContent = 'Barcode captured successfully!';

        await stopScanner();

        returnBtn.style.display = 'block';
        returnToRegistration();
      },
      () => {}
    );

    scanning = true;
    stopBtn.disabled = false;

    if (!scanComplete) {
      statusEl.textContent =
        'Point camera at the carton barcode.';
    }

  } catch (error) {
    scanning = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusEl.textContent =
      'Camera error: ' + (error.message || String(error));
  } finally {
    starting = false;
  }
}

async function stopScanner() {
  scanning = false;
  stopBtn.disabled = true;

  if (scanner) {
    const active = scanner;
    scanner = null;

    try {
      await active.stop();
    } catch (e) {}

    try {
      active.clear();
    } catch (e) {}
  }

  startBtn.disabled = false;
}

function returnToRegistration() {
  if (!scannedBarcode) return;

  const url = new URL(REGISTRATION_URL);
  url.searchParams.set('barcode', scannedBarcode);

  const state = new URLSearchParams(location.search)
    .get('state');

  if (state && /^[A-Za-z0-9_-]{10,100}$/.test(state)) {
    url.searchParams.set('state', state);
  }

  statusEl.textContent = 'Returning to registration...';
  window.location.assign(url.toString());
}
</script>
</body>
</html>
